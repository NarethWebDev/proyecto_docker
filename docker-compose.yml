services:
  nginx:
    image: nginx:alpine
    container_name: proxy_nginx
    ports: 
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      app_backend:
        condition: service_healthy
    networks:
      - red-cba-nareth
  servidor-bd-nareth:
    image: mysql:8.0
    container_name: contenedor-servidor-bd-nareth
    environment: 
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - mysql-data-nareth:/var/lib/mysql
    networks:
      - red-cba-nareth
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 3
  app_backend:
      build: .
      image: webdevnareth/api_naret:v1
      container_name: backend_nareth
      volumes:
        - .:/home/nareth
      environment:
        FLASK_ENV: development
        MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
        MYSQL_DATABASE: ${MYSQL_DATABASE}
      networks:
        - red-cba-nareth
      depends_on:
        servidor-bd-nareth:
          condition: service_healthy
      healthcheck:
        test: ["CMD-SHELL", "curl -f http://localhost:5050/ || exit 1"]
        interval: 10s
        timeout: 5s
        retries: 3  
networks: 
  red-cba-nareth: 
    name: red-cba-nareth-ejemplo

volumes:
  mysql-data-nareth:
    name: mysql-data-nareth
