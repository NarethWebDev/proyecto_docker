services:
  nginx-proxy-manager:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: proxy-manager
    restart: always
    ports:
      - "80:80" #Http
      - "81:81" #Administración de la API
      - "443:443" #Https
    volumes:
      - ./npm_data:/data
      - ./npm_letsencrypt:/etc/letsencrypt
    networks:
      - red-cba-nareth
  servidor-bd-nareth:
    image: mysql:8.0
    container_name: contenedor-servidor-bd-nareth
    environment: 
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - mysql-data-nareth:/var/lib/mysql
    networks:
      - red-cba-nareth
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 3
  app_backend:
      build: .
      image: webdevnareth/api_naret:v1
      container_name: backend_nareth
      volumes:
        - .:/home/nareth    @
      environment:
        FLASK_ENV: development
        MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
        MYSQL_DATABASE: ${MYSQL_DATABASE}
      networks:
        - red-cba-nareth
      depends_on:
        - servidor-bd-nareth
      condition: service_healthy
      healthcheck:
        test: ["CMD-SHELL", "curl -f http://localhost:5050/ || exit 1"]
        interval: 10s
        timeout: 5s
        retries: 3 

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    restart: always
    ports:
      - "3001:3001"
    volumes:
      - uptime-kuma-data:/app/data
    networks:
      - red-cba-nareth
    depends_on:
      - servidor-bd-nareth

networks: 
  red-cba-nareth: 
    name: red-cba-nareth-ejemplo

volumes:
  mysql-data-nareth:
    name: mysql-data-nareth

  uptime-kuma-data:
    name: uptime-kuma-data  
